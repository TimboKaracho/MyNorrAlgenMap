<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Norr-Älgen – GPS & Tiefenkarte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#map{background:#111}
.panel{position:absolute;z-index:1000;top:12px;left:12px;right:12px;max-width:520px;background:rgba(20,24,28,.92);color:#fff;padding:10px 12px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 12px;background:#2d9bc5;color:#fff;font-size:15px;font-weight:600}
label{font-size:14px}
input[type=range]{width:120px;vertical-align:middle}
#status{font-size:13px;opacity:.9;margin-top:7px}
.leaflet-control-layers{font-size:14px}
.ref-dot{width:14px;height:14px;background:#ff8c00;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 5px #000}
.gps-dot{width:16px;height:16px;background:#e00022;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 5px #000}
.legend{background:rgba(20,24,28,.9);color:#fff;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="row">
    <button id="gpsBtn">📍 Meine GPS-Position</button>
    <button id="refBtn">◎ Screenshot-Referenz</button>
    <button id="resetBtn">↺</button>
  </div>
  <div class="row" style="margin-top:8px">
    <label><input id="chartToggle" type="checkbox" checked> Tiefenkarte</label>
    <label>Deckkraft <input id="opacity" type="range" min="0" max="100" value="48"></label>
  </div>
  <div id="status">Satellitenkarte ist geografisch echt; GPS wird direkt auf diese Karte projiziert.</div>
</div>

const chart=L.imageOverlay(chartUrl,chartBounds,{opacity:.48,interactive:false}).addTo(map);

const refLat=59.8255861, refLon=14.5653703;
const refIcon=L.divIcon({className:'',html:'<div class="ref-dot"></div>',iconSize:[20,20],iconAnchor:[10,10]});
const ref=L.marker([refLat,refLon],{icon:refIcon,title:'Näherungsweise Position aus deinem Google-Maps-Screenshot'})
 .bindPopup('<b>Screenshot-Referenz</b><br>ca. 59.825586° N, 14.565370° E<br><small>Aus deinem hochgeladenen Google-Maps-Bild abgeleitet; nicht als exakte GPS-Koordinate verwenden.</small>')
 .addTo(map);

let gpsMarker=null, accCircle=null, watchId=null;

function setStatus(s){document.getElementById('status').innerHTML=s;}

function showGPS(p){
 const lat=p.coords.latitude,lon=p.coords.longitude,acc=p.coords.accuracy||0;
 if(!gpsMarker){
   const icon=L.divIcon({className:'',html:'<div class="gps-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]});
   gpsMarker=L.marker([lat,lon],{icon,zIndexOffset:1000,title:'Aktuelle GPS-Position'}).addTo(map);
 }else gpsMarker.setLatLng([lat,lon]);
 if(!accCircle) accCircle=L.circle([lat,lon],{radius:acc,weight:1,color:'#e00022',fillOpacity:.08}).addTo(map);
 else accCircle.setLatLng([lat,lon]).setRadius(acc);
 gpsMarker.bindPopup('<b>Aktuelle GPS-Position</b><br>'+lat.toFixed(6)+'° N<br>'+lon.toFixed(6)+'° E<br><small>Genauigkeit ca. '+Math.round(acc)+' m</small>');
 setStatus('🔴 GPS: '+lat.toFixed(6)+'° N, '+lon.toFixed(6)+'° E · Genauigkeit ca. '+Math.round(acc)+' m');
}

function gpsError(e){
 setStatus('GPS konnte nicht gelesen werden. Prüfe auf dem iPhone: Einstellungen → Datenschutz & Sicherheit → Ortungsdienste → Safari/Browser → Beim Verwenden.');
}

document.getElementById('gpsBtn').onclick=()=>{
 if(!navigator.geolocation){setStatus('Dieser Browser unterstützt keine Geolocation.');return;}
 setStatus('GPS wird angefragt …');
 navigator.geolocation.getCurrentPosition(showGPS,gpsError,{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 if(watchId!==null) navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(showGPS,gpsError,{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
};

document.getElementById('refBtn').onclick=()=>{
 map.setView([refLat,refLon],14);
 ref.openPopup();
};
document.getElementById('resetBtn').onclick=()=>map.setView([59.8256,14.585],13);

document.getElementById('chartToggle').onchange=e=>chart.setOpacity(e.target.checked?Number(document.getElementById('opacity').value)/100:0);
document.getElementById('opacity').oninput=e=>{if(document.getElementById('chartToggle').checked)chart.setOpacity(Number(e.target.value)/100)};

L.control.layers({'Satellit':sat,'OpenStreetMap':osm},{'Tiefen-/Fischereikarte':chart,'Screenshot-Referenz':ref},{collapsed:true}).addTo(map);
L.control.scale({imperial:false,maxWidth:150}).addTo(map);
</script>
