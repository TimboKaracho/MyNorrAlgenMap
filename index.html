<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Norr-Älgen – Tiefenkarte + Satellit</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#map{background:#dbe4e8}
.panel{position:absolute;z-index:1000;left:10px;top:10px;background:rgba(20,25,28,.92);color:#fff;padding:10px 12px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.35);max-width:330px}
.panel b{display:block;margin-bottom:7px}
.panel label{display:block;font-size:13px;margin-top:7px}
.panel input[type=range]{width:100%}
button{border:0;border-radius:10px;padding:9px 11px;background:#2d9bc5;color:#fff;font-weight:600;margin-top:8px}
#status{font-size:12px;opacity:.85;margin-top:7px;line-height:1.3}
.gps-dot{width:14px;height:14px;border-radius:50%;background:#e00024;border:3px solid #fff;box-shadow:0 1px 5px #000}
.gps-accuracy{border:2px solid rgba(224,0,36,.45);background:rgba(224,0,36,.10);border-radius:50%}
.ref-dot{width:10px;height:10px;border-radius:50%;background:#ff9800;border:2px solid #fff;box-shadow:0 1px 4px #000}
</style>
</head>

</div>

const depth = L.imageOverlay(chartUrl,bounds,{opacity:.48,interactive:false,zIndex:400}).addTo(map);

L.control.layers(
  {'🛰️ Satellit':satellite,'🗺️ Karte':streets},
  {'🎣 Tiefen-/Fischereikarte':depth},
  {collapsed:false}
).addTo(map);

const refLat=59.808510, refLon=14.552276;
L.marker([refLat,refLon],{
  icon:L.divIcon({className:'',html:'<div class="ref-dot"></div>',iconSize:[14,14],iconAnchor:[7,7]})
}).addTo(map).bindPopup('<b>Östra Gäddsjön</b><br>Referenzpunkt für die Georeferenzierung<br>59.808510° N, 14.552276° E');

let gpsMarker=null, accuracyCircle=null;

function setGPS(p) {
  const lat=p.coords.latitude, lon=p.coords.longitude, acc=p.coords.accuracy || 50;
  if(!gpsMarker) {
    gpsMarker=L.marker([lat,lon],{
      icon:L.divIcon({className:'',html:'<div class="gps-dot"></div>',iconSize:[20,20],iconAnchor:[10,10]})
    }).addTo(map);
  } else gpsMarker.setLatLng([lat,lon]);

  if(!accuracyCircle) {
    accuracyCircle=L.circle([lat,lon],{radius:acc,className:'gps-accuracy',color:'#e00024',fillColor:'#e00024',fillOpacity:.10,weight:2}).addTo(map);
  } else {
    accuracyCircle.setLatLng([lat,lon]).setRadius(acc);
  }

  gpsMarker.bindPopup('<b>GPS-Position</b><br>'+lat.toFixed(6)+'° N<br>'+lon.toFixed(6)+'° E<br>Genauigkeit ca. '+Math.round(acc)+' m');
  document.getElementById('status').textContent='GPS: '+lat.toFixed(6)+'° N, '+lon.toFixed(6)+'° E · ±'+Math.round(acc)+' m';
}

document.getElementById('gpsBtn').onclick=()=>{
  if(!navigator.geolocation) {
    document.getElementById('status').textContent='Geolocation wird von diesem Browser nicht unterstützt.';
    return;
  }
  document.getElementById('status').textContent='Standort wird ermittelt …';
  navigator.geolocation.getCurrentPosition(
    p=>{setGPS(p);map.setView([p.coords.latitude,p.coords.longitude],15);},
    e=>{document.getElementById('status').textContent='GPS fehlgeschlagen: '+e.message;},
    {enableHighAccuracy:true,timeout:15000,maximumAge:5000}
  );
};

let watchId=null;
function startWatch(){
  if(!navigator.geolocation || watchId!==null) return;
  watchId=navigator.geolocation.watchPosition(setGPS,()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
document.getElementById('gpsBtn').addEventListener('click',startWatch);

document.getElementById('opacity').oninput=e=>{
  const v=Number(e.target.value);
  depth.setOpacity(v/100);
  document.getElementById('opv').textContent=v;
};
document.getElementById('resetBtn').onclick=()=>map.setView([59.835,14.575],13);

map.fitBounds(bounds.pad(0.03));
